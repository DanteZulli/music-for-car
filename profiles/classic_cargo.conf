# Profile: Classic Cargo
# Stereo: Sony CDX-GT500US
# Speakers: 4-inch car speakers
#
# NOTE: Disable EQ7 on the stereo — the highpass filter already handles sub-bass.
#       Running both would over-cut the low end.

PROFILE_NAME="Classic Cargo"

# Audio settings
HIGHPASS_FREQ="100"
LOUDNORM_I="-16"
LOUDNORM_TP="-1.5"
LOUDNORM_LRA="11"
BITRATE="256k"
SAMPLE_RATE="44100"

# Performance
FFMPEG_THREADS="0"
FAST_LOUDNORM="false"
PARALLEL="true"
